[package]
name = "particlecode-core"
description = "Particle Code format: profiles, lattice layout, header, Reed-Solomon, fountain coding, sessions. no_std + alloc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
# `std` adds OS randomness for `Session::new` and `std::error::Error` impls.
std = ["dep:getrandom", "raptorq/std", "thiserror/std"]
# Serde derives on plain-data types (FrameSpec, Header, ...) for painters and manifests.
serde = ["dep:serde"]

[dependencies]
raptorq.workspace = true
libm.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
getrandom = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
