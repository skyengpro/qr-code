[package]
name = "particlecode-cli"
description = "Particle Code command line: encode payloads to PNG/GIF/SVG, decode images, inspect profiles, synthetic benchmarks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "particlecode_cli"
path = "src/lib.rs"

[[bin]]
name = "particlecode"
path = "src/main.rs"

[dependencies]
particlecode-core = { workspace = true, features = ["std", "serde"] }
particlecode-render.workspace = true
particlecode-vision.workspace = true
clap.workspace = true
anyhow.workspace = true
png.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true

[dev-dependencies]
gif.workspace = true

# Runnable examples live in the top-level `examples/` folder (see examples/README.md).
[[example]]
name = "encode_png"
path = "../../examples/encode_png.rs"

[[example]]
name = "animated_gif"
path = "../../examples/animated_gif.rs"

[[example]]
name = "shapes_gallery"
path = "../../examples/shapes_gallery.rs"

[[example]]
name = "symbol_roundtrip"
path = "../../examples/symbol_roundtrip.rs"

[[example]]
name = "print_poster"
path = "../../examples/print_poster.rs"

[[example]]
name = "readme_images"
path = "../../examples/readme_images.rs"

[lints]
workspace = true
