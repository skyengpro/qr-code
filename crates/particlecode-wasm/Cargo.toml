[package]
name = "particlecode-wasm"
description = "Particle Code encoder + canvas painter for the browser (wasm-bindgen): payload in, animated RGBA frames out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `std` is core's OS-randomness switch (`random_identity`); it builds on wasm32-unknown-unknown.
particlecode-core = { workspace = true, features = ["std"] }
particlecode-render.workspace = true
thiserror = { workspace = true, features = ["std"] }
# Exact pin: the generated JS glue and the `wasm-bindgen` CLI must be the same version.
# scripts/build-wasm.sh reads this line and refuses a CLI that differs.
wasm-bindgen.workspace = true

# getrandom has no backend on wasm32-unknown-unknown until `wasm_js` is on (it calls
# `crypto.getRandomValues`). Scoped to that target so native builds are untouched.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# Round trip: the pixels `tick` writes must decode with the phone's decoder.
particlecode-ffi.workspace = true

[lints]
workspace = true
