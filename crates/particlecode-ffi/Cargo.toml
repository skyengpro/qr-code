[package]
name = "particlecode-ffi"
description = "Particle Code bindings for the Flutter plugin (flutter_rust_bridge)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `cdylib` is the library the Flutter plugin bundles (Native Assets, see
# flutter/particle_code/hook/build.dart), whose builder also insists on `staticlib`;
# `lib` serves this crate's own tests.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
particlecode-core = { workspace = true, features = ["std", "serde"] }
# `ParticleDecoder::feed_yuv` / `feed_rgba` call `particlecode_vision::{locate, read}`.
particlecode-vision.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true, features = ["std"] }
# Runtime of the generated Dart bindings (src/frb_generated.rs).
flutter_rust_bridge.workspace = true

[dev-dependencies]
particlecode-render.workspace = true

[lints]
workspace = true
