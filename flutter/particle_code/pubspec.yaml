name: particle_code
description: Particle Code for Flutter. Show payloads as animated dot fields and scan them with the camera.
version: 0.2.0
publish_to: none
repository: https://github.com/vaam-apps/qr-code

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Must equal flutter_rust_bridge_codegen and the Rust crate (see flutter_rust_bridge.yaml).
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1

flutter:
  plugin:
    platforms:
      android:
        package: com.vaam.particlecode.flutter
        pluginClass: ParticleCodePlugin
      ios:
        pluginClass: ParticleCodePlugin
