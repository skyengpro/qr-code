name: Android

# Builds the JNI library for the Android ABIs, packages the AAR with Gradle (which also
# compiles the Kotlin sources) and runs the JVM-driven tests of the JNI crate. Separate from
# ci.yml because it needs the Android SDK/NDK and is slower.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      # ubuntu-latest ships the Android SDK and NDK (ANDROID_NDK_LATEST_HOME, ANDROID_HOME);
      # the script finds them.
      - name: Build libparticlecode_jni.so for arm64-v8a, armeabi-v7a, x86_64
        run: scripts/build-android.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble the AAR (compiles the Kotlin sources)
        run: gradle -p android :particlecode:assembleRelease

      - name: The AAR carries the native libraries
        run: |
          aar=$(ls android/particlecode/build/outputs/aar/*-release.aar)
          unzip -l "$aar" | tee /dev/stderr | grep -q 'jni/arm64-v8a/libparticlecode_jni.so'
          unzip -l "$aar" | grep -q 'jni/armeabi-v7a/libparticlecode_jni.so'
          unzip -l "$aar" | grep -q 'jni/x86_64/libparticlecode_jni.so'

      # Convenience download, not a check: a full artifact quota must not fail the job.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: particlecode-aar
          path: android/particlecode/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 7

  jvm-tests:
    # The JNI exports driven by a real JVM (a JDK is preinstalled on the runner): renders a
    # transfer, feeds it through direct ByteBuffers and checks the payload and error paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p particlecode-jni
