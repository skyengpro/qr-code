name: Flutter

# The particle_code Flutter plugin (flutter/particle_code) and its example app.
#
#   dart     analyze + test the plugin and the example against the host Rust library
#   codegen  the committed flutter_rust_bridge bindings equal what the generator produces
#   android  build the JNI library, then the example APK; the APK must carry it
#   ios      build the xcframework, then the example app for a device (no codesign), debug and
#            release; the Runner binary must export the dart:ffi symbols (pc_* and the
#            flutter_rust_bridge entry points)
#
# Separate from ci.yml, android.yml and apple.yml: it needs Flutter and is slower.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.9"

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The plugin finds target/debug by itself; naming it makes a wrong build obvious.
      PARTICLECODE_LIB: ${{ github.workspace }}/target/debug/libparticlecode_ffi.so
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The host library the encoder tests load through dart:ffi.
      - name: Build the host library
        run: cargo build -p particlecode-ffi

      - name: Plugin, flutter pub get
        working-directory: flutter/particle_code
        run: flutter pub get

      - name: Plugin, flutter analyze
        working-directory: flutter/particle_code
        run: flutter analyze

      - name: Plugin, flutter test
        working-directory: flutter/particle_code
        run: flutter test

      - name: Example, flutter pub get
        working-directory: flutter/particle_code/example
        run: flutter pub get

      - name: Example, flutter analyze
        working-directory: flutter/particle_code/example
        run: flutter analyze

      - name: Example, flutter test
        working-directory: flutter/particle_code/example
        run: flutter test

  # The Dart and Rust sides of the bridge are generated from crates/particlecode-ffi/src/api.
  # Regenerating must reproduce the committed files exactly, so a change to the API without a
  # regeneration (or a hand edit of generated code) fails here instead of at run time.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FRB_VERSION: "2.13.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Regenerate the bindings
        working-directory: flutter/particle_code
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Generated code is up to date
        run: |
          set -euo pipefail
          git status --porcelain
          if [ -n "$(git status --porcelain -- crates/particlecode-ffi flutter/particle_code/lib)" ]; then
            git --no-pager diff --stat
            echo "Generated bindings are stale: run flutter_rust_bridge_codegen generate in flutter/particle_code and commit." >&2
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      # ubuntu-latest ships the Android SDK and NDK (ANDROID_NDK_LATEST_HOME, ANDROID_HOME);
      # the script finds them. It writes android/particlecode/src/main/jniLibs, which the
      # plugin's Gradle build packages.
      - name: Build libparticlecode_jni.so for arm64-v8a, armeabi-v7a, x86_64
        run: scripts/build-android.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        working-directory: flutter/particle_code/example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: flutter/particle_code/example
        run: flutter build apk --debug

      - name: The APK carries the native library for every ABI
        working-directory: flutter/particle_code/example
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$apk"
          listing=$(unzip -l "$apk")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/$abi/libparticlecode_jni.so" <<< "$listing" \
              || { echo "lib/$abi/libparticlecode_jni.so is missing from $apk"; exit 1; }
            echo "found lib/$abi/libparticlecode_jni.so"
          done

      # The CAMERA permission comes from the plugin's manifest, not the app's, so this
      # checks the manifest merge. aapt2 ships with the SDK build tools on the runner.
      - name: The merged manifest asks for the camera and targets minSdk 24
        working-directory: flutter/particle_code/example
        run: |
          set -euo pipefail
          apk="$PWD/build/app/outputs/flutter-apk/app-debug.apk"
          aapt2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -n 1)
          perms=$("$aapt2" dump permissions "$apk")
          echo "$perms"
          grep -q "android.permission.CAMERA" <<< "$perms"
          badging=$("$aapt2" dump badging "$apk")
          # Older aapt2 prints sdkVersion:'24', newer minSdkVersion:'24'.
          grep -i "sdkversion" <<< "$badging" || true
          grep -qiE "(^|[^a-z])(min)?sdkversion:'24'" <<< "$badging" \
            || { echo "minSdk is not 24"; exit 1; }

      # Convenience download, not a check: a full artifact quota must not fail the job.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: particle-code-example-debug-apk
          path: flutter/particle_code/example/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # rust-toolchain.toml pins 1.97.0 (minimal profile) for this directory. Make sure the
      # toolchain that cargo resolves here, not only the one installed above, has the targets.
      - name: Rust targets for the pinned toolchain
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Every pc_* function of the header must be referenced by the plugin's SymbolKeeper.
      - name: SymbolKeeper covers the C header
        run: flutter/particle_code/ios/tool/check-symbols.sh

      # Every ParticleCodeKit source must be linked into the plugin's Sources/particle_code/ParticleCodeKit.
      - name: ParticleCodeKit sources are linked into the plugin pod
        run: flutter/particle_code/ios/tool/check-kit-links.sh

      # Leaves ParticleCodeFFI.xcframework in flutter/particle_code/ios/particle_code/Frameworks, which the
      # plugin's podspec vendors.
      - name: Build ParticleCodeFFI.xcframework for the plugin
        run: scripts/build-xcframework.sh --flutter --no-zip

      - name: flutter pub get
        working-directory: flutter/particle_code/example
        run: flutter pub get

      # Device builds without signing: they link the app for arm64, which is where the
      # SymbolKeeper arrangement has to hold. First through Swift Package Manager (the
      # plugin's ios/particle_code/Package.swift), then through CocoaPods (the podspec).
      - name: "SwiftPM: flutter build ios --debug --no-codesign"
        working-directory: flutter/particle_code/example
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter build ios --debug --no-codesign 2>&1 | tee build-spm.log
          # Flutter falls back to CocoaPods for plugins without a Package.swift and says so.
          if grep -q "do not support Swift Package Manager" build-spm.log; then
            echo "particle_code was not built through Swift Package Manager"; exit 1
          fi
          grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "Runner has no SwiftPM plugin integration"; exit 1; }

      - name: "SwiftPM: the debug app exports the dart:ffi symbols"
        working-directory: flutter/particle_code/example
        run: tool/check_ios_symbols.sh build/ios/iphoneos/Runner.app

      # Release turns on dead-stripping and symbol stripping, which is what would remove
      # functions that only Dart calls.
      - name: "SwiftPM: flutter build ios --release --no-codesign"
        working-directory: flutter/particle_code/example
        run: flutter build ios --release --no-codesign

      - name: "SwiftPM: the release app exports the dart:ffi symbols"
        working-directory: flutter/particle_code/example
        run: tool/check_ios_symbols.sh build/ios/iphoneos/Runner.app

      # The podspec must keep working for apps that have not moved to SwiftPM. The example's
      # project carries SwiftPM integration (Flutter 3.47 creates projects with it), so this
      # builds a fresh app created with SwiftPM disabled, the way a CocoaPods-based consumer
      # looks, and checks it the same way.
      - name: "CocoaPods: release build of a fresh app that uses the plugin"
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          app="$RUNNER_TEMP/pods_app"
          flutter create --org com.vaam.particlecode --platforms ios --project-name pods_app "$app"
          cd "$app"
          flutter pub add "particle_code:{\"path\":\"$GITHUB_WORKSPACE/flutter/particle_code\"}"
          flutter build ios --release --no-codesign
          grep -q "particle_code" ios/Podfile.lock \
            || { echo "particle_code was not installed through CocoaPods"; exit 1; }
          if grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj; then
            echo "unexpected SwiftPM integration in the CocoaPods app"; exit 1
          fi
          "$GITHUB_WORKSPACE/flutter/particle_code/example/tool/check_ios_symbols.sh" build/ios/iphoneos/Runner.app
