name: Flutter

# The particle_code Flutter plugin (flutter/particle_code) and the demo app (examples/flutter-demo).
#
#   dart     analyze + test the plugin and the demo (the Native Assets hook builds the
#            Rust library for the host)
#   codegen  the committed flutter_rust_bridge bindings equal what the generator produces
#   android  build the demo APK; it must carry the Rust library (built by the hook) and the
#            plugin's JNI address helper for every ABI
#   ios      build the demo app for a device (no codesign) through SwiftPM and through
#            CocoaPods; it must embed the Rust library as particlecode_ffi.framework
#
# The hook runs `rustup`, which installs the toolchain and targets pinned in
# crates/particlecode-ffi/rust-toolchain.toml; the runners ship rustup.
#
# Separate from ci.yml: it needs Flutter and is slower.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.9"

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Plugin, flutter pub get
        working-directory: flutter/particle_code
        run: flutter pub get

      - name: Plugin, flutter analyze
        working-directory: flutter/particle_code
        run: flutter analyze

      - name: Plugin, flutter test
        working-directory: flutter/particle_code
        run: flutter test

      - name: Demo, flutter pub get
        working-directory: examples/flutter-demo
        run: flutter pub get

      - name: Demo, flutter analyze
        working-directory: examples/flutter-demo
        run: flutter analyze

      - name: Demo, flutter test
        working-directory: examples/flutter-demo
        run: flutter test

  # The Dart and Rust sides of the bridge are generated from crates/particlecode-ffi/src/api.
  # Regenerating must reproduce the committed files exactly, so a change to the API without a
  # regeneration (or a hand edit of generated code) fails here instead of at run time.
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FRB_VERSION: "2.13.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ env.FRB_VERSION }}-${{ runner.os }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Regenerate the bindings
        working-directory: flutter/particle_code
        run: |
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Generated code is up to date
        run: |
          set -euo pipefail
          git status --porcelain
          if [ -n "$(git status --porcelain -- crates/particlecode-ffi flutter/particle_code/lib)" ]; then
            git --no-pager diff --stat
            echo "Generated bindings are stale: run flutter_rust_bridge_codegen generate in flutter/particle_code and commit." >&2
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        working-directory: examples/flutter-demo
        run: flutter pub get

      # ubuntu-latest ships the Android SDK and NDK; the hook links the Rust library with the
      # NDK that Flutter hands it.
      - name: flutter build apk --debug
        working-directory: examples/flutter-demo
        run: flutter build apk --debug

      - name: The APK carries both native libraries for every ABI
        working-directory: examples/flutter-demo
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -f "$apk"
          listing=$(unzip -l "$apk")
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libparticlecode_ffi.so libparticle_code_jni.so; do
              grep -q "lib/$abi/$lib" <<< "$listing" \
                || { echo "lib/$abi/$lib is missing from $apk"; exit 1; }
              echo "found lib/$abi/$lib"
            done
          done

      # The CAMERA permission comes from the plugin's manifest, not the app's, so this
      # checks the manifest merge. aapt2 ships with the SDK build tools on the runner.
      - name: The merged manifest asks for the camera and targets minSdk 24
        working-directory: examples/flutter-demo
        run: |
          set -euo pipefail
          apk="$PWD/build/app/outputs/flutter-apk/app-debug.apk"
          aapt2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -n 1)
          perms=$("$aapt2" dump permissions "$apk")
          echo "$perms"
          grep -q "android.permission.CAMERA" <<< "$perms"
          badging=$("$aapt2" dump badging "$apk")
          # Older aapt2 prints sdkVersion:'24', newer minSdkVersion:'24'.
          grep -i "sdkversion" <<< "$badging" || true
          grep -qiE "(^|[^a-z])(min)?sdkversion:'24'" <<< "$badging" \
            || { echo "minSdk is not 24"; exit 1; }

      # Convenience download, not a check: a full artifact quota must not fail the job.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: particle-code-flutter-demo-debug-apk
          path: examples/flutter-demo/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter pub get
        working-directory: examples/flutter-demo
        run: flutter pub get

      # Device builds without signing. First through Swift Package Manager (the plugin's
      # ios/particle_code/Package.swift), then through CocoaPods (the podspec). Release builds
      # strip and dead-strip, which must leave the bundled Rust framework alone.
      - name: "SwiftPM: flutter build ios --release --no-codesign"
        working-directory: examples/flutter-demo
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter build ios --release --no-codesign 2>&1 | tee build-spm.log
          # Flutter falls back to CocoaPods for plugins without a Package.swift and says so.
          if grep -q "do not support Swift Package Manager" build-spm.log; then
            echo "particle_code was not built through Swift Package Manager"; exit 1
          fi
          grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "Runner has no SwiftPM plugin integration"; exit 1; }

      - name: "SwiftPM: the app embeds the Rust library and it exports the bridge"
        working-directory: examples/flutter-demo
        run: ../../flutter/particle_code/tool/check_ios_app.sh build/ios/iphoneos/Runner.app

      # The podspec must keep working for apps that have not moved to SwiftPM. The demo's
      # project carries SwiftPM integration (Flutter 3.47 creates projects with it), so this
      # builds a fresh app created with SwiftPM disabled, the way a CocoaPods-based consumer
      # looks, and checks it the same way.
      - name: "CocoaPods: release build of a fresh app that uses the plugin"
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          app="$RUNNER_TEMP/pods_app"
          flutter create --org com.vaam.particlecode --platforms ios --project-name pods_app "$app"
          cd "$app"
          flutter pub add "particle_code:{\"path\":\"$GITHUB_WORKSPACE/flutter/particle_code\"}"
          flutter build ios --release --no-codesign
          grep -q "particle_code" ios/Podfile.lock \
            || { echo "particle_code was not installed through CocoaPods"; exit 1; }
          if grep -q "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj; then
            echo "unexpected SwiftPM integration in the CocoaPods app"; exit 1
          fi
          "$GITHUB_WORKSPACE/flutter/particle_code/tool/check_ios_app.sh" build/ios/iphoneos/Runner.app
