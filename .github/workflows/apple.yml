name: Apple

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  xcframework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins 1.97.0 (minimal profile) for this directory. Make sure the
      # toolchain that cargo resolves here, not only the one installed above, has the targets.
      - name: Rust targets for the pinned toolchain
        run: |
          rustup target add \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios \
            aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build ParticleCodeFFI.xcframework (iOS + macOS slices)
        run: scripts/build-xcframework.sh --macos

      - name: Every header function is in every slice
        run: |
          set -euo pipefail
          fns=$(grep -oE 'pc_[a-z0-9_]+\(' crates/particlecode-ffi/include/particlecode.h | tr -d '(' | sort -u)
          test -n "$fns"
          for lib in target/apple/ParticleCodeFFI.xcframework/*/libparticlecode_ffi.a; do
            echo "== $lib"
            lipo -info "$lib"
            # Apple nm exits non-zero when some archive members have no external symbols;
            # that is expected, so judge it by its output instead.
            syms=$(nm -g "$lib" 2>/dev/null || true)
            test -n "$syms" || { echo "nm printed nothing for $lib"; exit 1; }
            for fn in $fns; do
              # Here-string, not a pipe: with pipefail, grep -q closing early would fail the pipe.
              grep -qE " T _${fn}\$" <<< "$syms" || { echo "missing $fn in $lib"; exit 1; }
            done
          done

      - name: swift build (macOS)
        working-directory: apple/ParticleCodeKit
        run: swift build

      - name: swift test (macOS)
        working-directory: apple/ParticleCodeKit
        run: swift test

      # Compiles the Swift sources against the iOS slice of the xcframework and links the
      # library product for a device.
      - name: xcodebuild (generic iOS device)
        working-directory: apple/ParticleCodeKit
        run: |
          xcodebuild -scheme ParticleCodeKit \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: xcodebuild (generic iOS Simulator)
        working-directory: apple/ParticleCodeKit
        run: |
          xcodebuild -scheme ParticleCodeKit \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Signal only: the CocoaPods path (library xcframework in vendored_frameworks) is the
      # least tested one, so a failure here must not block the SwiftPM path.
      - name: pod lib lint (CocoaPods)
        continue-on-error: true
        run: pod lib lint apple/ParticleCodeKit.podspec --allow-warnings --skip-tests

      - name: Summary
        run: |
          {
            echo "### ParticleCodeFFI.xcframework"
            echo
            echo '```'
            du -sh target/apple/ParticleCodeFFI.xcframework target/apple/ParticleCodeFFI.xcframework.zip
            for lib in target/apple/ParticleCodeFFI.xcframework/*/libparticlecode_ffi.a; do du -h "$lib"; done
            echo '```'
            echo "SwiftPM checksum of the zip:"
            echo '```'
            swift package --package-path apple/ParticleCodeKit compute-checksum target/apple/ParticleCodeFFI.xcframework.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A convenience download, not a check: an exhausted artifact storage quota must not
      # turn the build red.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ParticleCodeFFI.xcframework
          path: target/apple/ParticleCodeFFI.xcframework.zip
          if-no-files-found: error
          retention-days: 7
