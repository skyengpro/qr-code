[package]
name = "particlecode-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
particlecode-core = { path = "../crates/particlecode-core" }

# Not a member of the main workspace; build with `cd fuzz && cargo +nightly fuzz run header`.
[workspace]

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false
