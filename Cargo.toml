[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT"
repository = "https://github.com/vaam-apps/qr-code"
authors = ["Stephane Segning <stephane.segning@ssegning.com>"]

[workspace.dependencies]
# Internal crates
particlecode-core = { path = "crates/particlecode-core", default-features = false }
particlecode-vision = { path = "crates/particlecode-vision" }
particlecode-render = { path = "crates/particlecode-render" }
particlecode-shapes = { path = "crates/particlecode-shapes" }
particlecode-ffi = { path = "crates/particlecode-ffi" }
particlecode-wasm = { path = "crates/particlecode-wasm" }

# Core (no_std + alloc friendly)
raptorq = { version = "2.0.1", default-features = false }
libm = "0.2.16"
hmac = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
getrandom = "0.4.2"
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.20", default-features = false }

# Rendering / tooling (std)
tiny-skia = "0.12.0"
png = "0.18.1"
gif = "0.14.2"
svgtypes = "0.16.1"
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

# Mobile bindings
jni = "0.22.4"

# Browser bindings. Exact pin: the `wasm-bindgen` CLI that post-processes the .wasm must be
# the same version (scripts/build-wasm.sh enforces it, reading this line).
wasm-bindgen = "=0.2.128"

# Testing
proptest = "1.11.0"
criterion = "0.8.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight numeric/geometry code more than they help.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
many_single_char_names = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
# Hygiene beyond pedantic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (scripts/build-wasm.sh). Kept as its own profile so the native libraries
# and the CLI keep the `release` settings above. Measured on the module (Node 22, profile S at
# 656 px): opt-level "s" gave a 794 KB module and 23 ms per tick, 2 gave 675 KB and 13 ms, 3 gave
# 692 KB and 13 ms, so 2 is both the smallest and as fast as 3.
[profile.release-wasm]
inherits = "release"
opt-level = 2
lto = true
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
# Dependencies (raptorq, tiny-skia) are painfully slow unoptimised; tests stay fast.
opt-level = 2

[profile.test]
opt-level = 1
